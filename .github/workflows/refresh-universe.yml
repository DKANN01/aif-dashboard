name: Refresh stock universe

# The construction tab searches a pre-baked universe because no public quote
# API sends CORS headers, so the browser cannot look a ticker up itself.
# This rewrites ~750 detail files, so it runs weekly rather than daily to keep
# the repository history from growing by several megabytes a day. The holdings
# dashboard still refreshes every weekday via refresh.yml.

on:
  schedule:
    # Saturday 07:00 UTC - well clear of the week's last close.
    - cron: "0 7 * * 6"
  workflow_dispatch:
    inputs:
      top:
        description: "How many companies by market cap"
        default: "750"

permissions:
  contents: write

jobs:
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bake the searchable universe
        run: python3 scripts/fetch_universe.py --top "${{ github.event.inputs.top || 750 }}"

      - name: Commit if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/universe.json data/detail
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Refresh stock universe"
            git push
          fi
